# Steady traffic for the canary analysis: three workers across the three API routes,
# with a count of responses by status printed every 10 seconds (kubectl logs -f deploy/loadgen -n m06).
apiVersion: v1
kind: ConfigMap
metadata:
  name: loadgen
  namespace: m06
data:
  run.sh: |
    #!/bin/sh
    # Three workers, each request capped at 3 s, so one slow connection never stalls the traffic.
    worker() {
      while true; do
        for route in orders items checkout; do
          curl -s -o /dev/null --connect-timeout 1 --max-time 3 -w '%{http_code}\n' "http://sample-app/api/$route"
        done
        sleep 0.1
      done
    }
    for n in 1 2 3; do worker & done | while true; do
      ok=0; bad=0; end=$(( $(date +%s) + 10 ))
      while [ "$(date +%s)" -lt "$end" ] && read -r code; do
        case "$code" in 2*) ok=$((ok+1));; *) bad=$((bad+1));; esac
      done
      echo "$(date -u +%H:%M:%S)  last 10s: $((ok+bad)) requests  2xx=$ok  other=$bad"
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: m06
spec:
  replicas: 1
  selector:
    matchLabels: { app: loadgen }
  template:
    metadata:
      labels: { app: loadgen }
    spec:
      containers:
        - name: loadgen
          image: curlimages/curl:8.11.1
          command: ["/bin/sh", "/scripts/run.sh"]
          volumeMounts:
            - { name: scripts, mountPath: /scripts }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 64Mi }
      volumes:
        - name: scripts
          configMap: { name: loadgen }
